name: PR approval

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: PR approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub environment reviewers are the authoritative approver list. Unlike
    # PR reviews, this gate permits reviewers to approve their own changes.
    # Required deployments in the repository ruleset prevent skipping this gate
    # by editing the workflow or spoofing a check with the same name.
    environment: pr-approval
    steps:
      - name: Record approval
        run: echo "The required reviewer approved this revision."
