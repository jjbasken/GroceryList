services:
  web:
    build: .
    volumes:
      - grocery-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=/data/grocery.db
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  grocery-data:
