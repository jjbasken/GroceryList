services:
  web:
    build: .
    volumes:
      - ./data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE=/data/grocery.db
    ports:
      # Loopback only: public traffic must come through the Cloudflare tunnel,
      # which reaches web:5000 over grocery-net. Binding 0.0.0.0 would expose
      # plaintext HTTP to the LAN and bypass host firewall rules (Docker
      # inserts its own iptables rules ahead of ufw/firewalld).
      - 127.0.0.1:5000:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - grocery-net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - TUNNEL_ORIGIN_SERVER_NAME=grocerylist.basken.net
    networks:
      - grocery-net

networks:
  grocery-net:
