{% extends "base.html" %}
{% block body %}
<header>
    <h1>Admin Panel</h1>
    <a href="{{ url_for('admin_users') }}" class="logout-btn">Back</a>
</header>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="admin-flash-container">
      {% for msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<main class="admin-main">
    <section class="admin-section">
        <h2 class="admin-section-title">Reset password for {{ user.username }}</h2>
        <form method="post" action="{{ url_for('admin_reset_password', user_id=user.id) }}" class="admin-create-form">
            <input type="password" name="password" placeholder="New temporary password" autocomplete="new-password" required autofocus>
            <button type="submit" class="admin-action-btn btn-ok">Reset password</button>
        </form>
    </section>
</main>
{% endblock %}
