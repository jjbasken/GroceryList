{% extends "base.html" %}
{% block head %}
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
{% endblock %}
{% block body %}
<header>
    <h1>GroceryList</h1>
    <div class="header-actions">
        {% if is_admin %}
        <a href="{{ url_for('admin_users') }}" class="admin-btn">Admin</a>
        {% endif %}
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>
</header>

<div class="list-bar">
    <select id="list-select" class="list-select" aria-label="Select list"></select>
    <button id="new-list-btn" class="new-list-btn" aria-label="New list" title="New list">+</button>
    <button id="delete-list-btn" class="delete-list-btn" aria-label="Delete list" title="Delete list">&#x2715;</button>
</div>

<div class="add-bar">
    <input type="text" id="item-input" placeholder="Add item..." list="item-suggestions" autocomplete="off" enterkeyhint="go">
    <input type="text" id="qty-input" class="qty-input" placeholder="Qty" aria-label="Quantity">
    <select id="section-select">
        <option value="now">Now</option>
        <option value="later">Later</option>
    </select>
    <button id="add-btn" aria-label="Add item">+</button>
    <input type="text" id="notes-input" class="notes-input" placeholder="Notes (optional)" aria-label="Notes">
</div>
<datalist id="item-suggestions"></datalist>

<main>
    <section id="section-now">
        <h2>Need Now (<span class="count">0</span>)</h2>
        <ul class="item-list"></ul>
    </section>

    <section id="section-later">
        <h2>Need Later (<span class="count">0</span>)</h2>
        <ul class="item-list"></ul>
    </section>

    <section id="section-bought">
        <h2>Bought (<span class="count">0</span>)</h2>
        <ul class="item-list"></ul>
    </section>
</main>

<div class="bottom-actions">
    <button id="clear-bought-btn">Clear bought items</button>
</div>
{% endblock %}
